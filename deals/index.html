<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BerlinDeals Map - Supermarket Offers in Berlin</title>
<meta name="description" content="Search grocery products and see which Berlin supermarkets have them on offer this week, on a map.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
:root{
  --surface-1:#fff;--surface-2:#fafaf8;--border:#e5e0d8;--border-strong:#d4cfc7;
  --border-accent:#2563eb;--text-primary:#1a1a18;--text-secondary:#6b6560;
  --text-muted:#9b9590;--text-accent:#2563eb;--bg-accent:#eff6ff;
  --bg-success:#e8f5e9;--bg-danger:#fce4e4;--text-success:#2e7d32;
  --text-danger:#c62828;--radius:8px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:var(--font-sans);background:var(--surface-2);color:var(--text-primary);font-size:14px}
a{color:var(--text-accent);text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
.app{display:flex;flex-direction:column;height:100%}
.topbar{height:48px;background:var(--surface-2);border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;z-index:1000}
.topbar .legal{font-size:11px;color:var(--text-muted);text-decoration:none}
.topbar .legal:hover{color:var(--text-accent)}
.logo{font-weight:600;font-size:14px;color:var(--text-primary);white-space:nowrap;display:flex;align-items:center;gap:6px;user-select:none}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--text-danger)}
.search-wrap{flex:1;max-width:380px;position:relative}
.search-wrap input{width:100%;height:34px;border-radius:var(--radius);border:.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-size:13px;padding:0 28px 0 32px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--border-accent)}
.search-wrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;pointer-events:none}
.search-wrap .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:16px;cursor:pointer;display:none;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%}
.search-wrap .clear.visible{display:flex}
.search-wrap .clear:hover{background:var(--border);color:var(--text-primary)}
.pill{height:28px;border-radius:14px;border:.5px solid var(--border);background:var(--surface-1);color:var(--text-secondary);font-size:12px;padding:0 10px;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s;user-select:none}
.pill:hover{background:var(--bg-accent)}
.pill.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.lang{margin-left:auto;height:28px;border-radius:14px;border:.5px solid var(--border);background:var(--surface-1);color:var(--text-secondary);font-size:12px;padding:0 10px;display:flex;align-items:center;gap:3px;cursor:pointer;user-select:none}
.lang:hover{background:var(--bg-accent)}
.lang span{font-weight:500;font-size:11px}
.lang span.ac{color:var(--text-accent)}
.body{flex:1;display:flex;overflow:hidden;position:relative}
.map-wrap{flex:1;position:relative;background:#e8e0d8}
#map{width:100%;height:100%}
.map-overlay{position:absolute;bottom:12px;left:12px;font-size:10px;color:#666;background:rgba(255,255,255,.88);padding:2px 6px;border-radius:4px;z-index:500;pointer-events:none}
.loc-btn{position:absolute;bottom:48px;right:10px;width:32px;height:32px;background:var(--surface-1);border:.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-accent);z-index:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.loc-btn:hover{background:var(--bg-accent)}
.loc-btn.active{background:var(--bg-accent);border-color:var(--border-accent)}
.sidebar{width:300px;background:var(--surface-2);border-left:.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:10px 12px;border-bottom:.5px solid var(--border);flex-shrink:0}
.sidebar-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.sidebar-count{font-size:12px;color:var(--text-secondary);font-weight:400}
.sidebar-subtitle{font-size:11px;color:var(--text-muted)}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;padding:8px 12px;border-bottom:.5px solid var(--border);flex-shrink:0}
.chain-pill{cursor:pointer}
.results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.result-card{padding:10px 12px;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .1s}
.result-card:hover{background:var(--surface-1)}
.result-card.active{background:var(--bg-accent);border-left:3px solid var(--border-accent);padding-left:9px}
.result-chain-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.chain-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.result-chain{font-size:11px;color:var(--text-secondary);font-weight:500}
.result-dist{font-size:11px;color:var(--text-muted);margin-left:auto}
.result-product{font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:3px;line-height:1.3}
.result-price-row{display:flex;align-items:center;gap:6px}
.result-price{font-size:15px;font-weight:600;color:var(--text-primary)}
.result-orig{font-size:12px;color:var(--text-muted);text-decoration:line-through}
.result-disc{font-size:11px;font-weight:500;background:var(--bg-danger);color:var(--text-danger);padding:1px 5px;border-radius:4px}
.result-valid{font-size:11px;color:var(--text-muted);margin-top:2px}
.empty-state{padding:32px 16px;text-align:center;color:var(--text-secondary)}
.empty-state .empty-icon{font-size:32px;margin-bottom:8px}
.empty-state h3{font-size:15px;margin-bottom:4px;color:var(--text-primary)}
.empty-state p{font-size:12px;line-height:1.5}
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 16px rgba(0,0,0,.12)!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important;min-width:220px;max-width:280px}
.leaflet-popup-close-button{top:8px!important;right:8px!important;color:var(--text-muted)!important}
.popup-header{padding:10px 12px 8px;border-bottom:.5px solid var(--border)}
.popup-chain{font-size:10px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.popup-name{font-size:14px;font-weight:500;color:var(--text-primary);margin-bottom:1px}
.popup-addr{font-size:11px;color:var(--text-muted)}
.popup-badge{display:inline-flex;align-items:center;gap:4px;height:20px;border-radius:10px;background:var(--bg-success);color:var(--text-success);font-size:10px;font-weight:500;padding:0 7px;margin-top:5px}
.popup-dist{font-size:11px;color:var(--text-muted);margin-top:2px}
.offer-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:.5px solid var(--border)}
.offer-row:last-of-type{border-bottom:none}
.offer-name{flex:1;font-size:12px;color:var(--text-primary);line-height:1.3}
.offer-price-col{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.offer-orig{font-size:11px;color:var(--text-muted);text-decoration:line-through}
.offer-price{font-size:13px;font-weight:600;color:var(--text-primary)}
.disc-badge{background:var(--bg-danger);color:var(--text-danger);font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px}
.popup-footer{padding:7px 12px;border-top:.5px solid var(--border)}
.popup-footer a{font-size:11px;color:var(--text-accent);display:flex;align-items:center;gap:4px}
@media(max-width:768px){
  .topbar{gap:6px;padding:0 8px;height:44px}
  .search-wrap{max-width:none}
  .pill{font-size:11px;padding:0 8px;height:26px}
  .lang{font-size:11px;padding:0 8px;height:26px}
  .body{flex-direction:column}
  .map-wrap{flex:1;min-height:300px}
  .sidebar{width:100%;max-height:45vh;border-left:none;border-top:.5px solid var(--border)}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo"><span class="logo-dot"></span>BerlinDeals Map</div>
    <a class="legal" href="about.html">About</a><a class="legal" href="privacy.html">Privacy</a><a class="legal" href="impressum.html">Impressum</a>
    <div class="search-wrap">
      <span class="si">&#128269;</span>
      <input type="text" id="searchInput" placeholder="Search a product..." aria-label="Search for offers" autocomplete="off">

    </div>
    <div class="pill" id="radiusFilterPill" style="display:none" onclick="cycleRadius()">&#128205; <span>5 km</span></div>
    <div class="pill" id="discountFilterPill" onclick="cycleDiscount()">&#127991; <span>Any discount</span></div>
    <div class="lang" onclick="toggleLang()"><span id="langDe" class="ac">DE</span><span>/</span><span id="langEn">EN</span></div>
  </div>
  <div class="body">
    <div class="map-wrap">
      <div id="map"></div>
      <div class="map-overlay">&copy; OpenStreetMap contributors</div>
      <button class="loc-btn" id="locBtn" onclick="getUserLocation()" title="Use my location">&#9678;</button>
    </div>
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title"><span data-t="search_results">Search results</span><span class="sidebar-count" id="resultCount">-</span></div>
        <div class="sidebar-subtitle" id="sidebarSubtitle" data-t="showing_all">Showing all offers across all chains</div>
      </div>
      <div class="filter-row" id="chainPills"></div>
      <div class="results" id="results"></div>
    </div>
  </div>
</div>

  if(offers.length>0){
    h+='<div class="popup-badge">&#127991; '+offers.length+' '+t('active_offers')+'</div></div>';
    offers.slice(0,3).forEach(function(o){var pc='';if(o.discountPct!=null)pc='<span class="disc-badge">-'+o.discountPct+'%</span>';var op='';if(o.origPrice!=null)op='<span class="offer-orig">&euro;'+formatPrice(o.origPrice)+'</span>';h+='<div class="offer-row"><div class="offer-name">'+o.product+'</div><div class="offer-price-col"><div style="display:flex;align-items:center;gap:4px">'+op+pc+'</div><div class="offer-price">&euro;'+formatPrice(o.offerPrice)+'</div></div></div>'});
    if(offers.length>3)h+='<div class="offer-row"><div class="offer-name" style="color:var(--text-accent);text-align:center;font-size:12px">+ '+(offers.length-3)+' more</div></div>';
    h+='<div class="popup-footer"><a href="'+offers[0].sourceUrl+'" target="_blank" rel="noopener">&#8599; '+t('view_on')+' '+s.chain+'.de</a></div>';
  }else{h+='</div><div class="offer-row"><div class="offer-name" style="color:var(--text-muted);text-align:center">'+(lang==='de'?'Keine aktuellen Angebote':'No current offers')+'</div></div>'}
  return h;
}

// SEARCH & FILTER
function initSearch(){
  fuse=new Fuse(BERLINDEALS_DATA.offers||[],{keys:['product','category','chain'],threshold:0.4,distance:100,minMatchCharLength:2,includeScore:true,ignoreLocation:true});
}

function getFilteredOffers(){
  var q=document.getElementById('searchInput').value.trim().toLowerCase();
  var all=BERLINDEALS_DATA.offers||[],stores=BERLINDEALS_DATA.stores||[];
  var csm={};stores.forEach(function(s){if(!csm[s.chain])csm[s.chain]=[];csm[s.chain].push(s)});
  var f=all;
  if(activeChains.size>0)f=f.filter(function(o){return activeChains.has(o.chain)});
  if(discountMin>0)f=f.filter(function(o){return o.discountPct!=null&&o.discountPct>=discountMin});
  if(radiusKm&&userLat)f=f.filter(function(o){var cs=csm[o.chain]||[];return cs.some(function(s){return haversine(userLat,userLng,s.lat,s.lon)<=radiusKm})});
  if(q.length>=2){var r=fuse.search(q),ids=new Set(r.map(function(x){return x.item.id}));f=f.filter(function(o){return ids.has(o.id)})}
  var today=(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
  f=f.filter(function(o){return o.validFrom<=today});
  f=f.filter(function(o){return !o.validUntil||o.validUntil>=today});
  f.sort(function(a,b){return b.discountPct-a.discountPct});
  return f;
}

function updateAll(){renderAllMarkers();renderSidebar();updateChainPills()}

// SIDEBAR
function renderSidebar(){
  var offers=getFilteredOffers(),stores=BERLINDEALS_DATA.stores||[],q=document.getElementById('searchInput').value.trim();
  document.getElementById('resultCount').textContent=offers.length+' '+(lang==='de'?'Angebote':'offers');
  var sub=document.getElementById('sidebarSubtitle');
  sub.textContent=q.length>=2?(lang==='de'?'Ergebnisse f\u00fcr "':'Showing "')+q+'" '+t('across'):t('showing_all');
  if(offers.length===0){document.getElementById('results').innerHTML='<div class="empty-state"><div class="empty-icon">&#128269;</div><h3>'+t('no_results')+'</h3><p>'+t('no_results_desc')+'</p></div>';return}
  var ns={};if(userLat)stores.forEach(function(s){var d=haversine(userLat,userLng,s.lat,s.lon);if(!ns[s.chain]||d<ns[s.chain].dist)ns[s.chain]={store:s,dist:d}});
  var h='';offers.forEach(function(o){
    var ds='';if(userLat&&ns[o.chain])ds='<span class="result-dist">'+formatDist(ns[o.chain].dist)+'</span>';
    var pop='';if(o.origPrice!=null)pop='<span class="result-orig">&euro;'+formatPrice(o.origPrice)+'</span>';var pdp='';if(o.discountPct!=null)pdp='<span class="result-disc">-'+o.discountPct+'%</span>';h+='<div class="result-card" onclick="focusChain(\''+o.chain+'\')"><div class="result-chain-row"><div class="chain-dot" style="background:'+o.chainColor+'"></div><span class="result-chain">'+o.chain+'</span>'+ds+'</div><div class="result-product">'+o.product+'</div><div class="result-price-row"><span class="result-price">&euro;'+formatPrice(o.offerPrice)+'</span>'+pop+pdp+'</div><div class="result-valid">'+t('valid_until')+' '+formatDate(o.validUntil)+'</div></div>';
  });
  document.getElementById('results').innerHTML=h;
}

function focusChain(chain){
  var stores=BERLINDEALS_DATA.stores||[],cs=stores.filter(function(s){return s.chain===chain});
  if(!cs.length)return;
  if(userLat)cs.sort(function(a,b){return haversine(userLat,userLng,a.lat,a.lon)-haversine(userLat,userLng,b.lat,b.lon)});
  var t=cs[0];map.setView([t.lat,t.lon],15,{animate:true});
  setTimeout(function(){markers.forEach(function(m){if(m._storeData&&m._storeData.id===t.id)m.openPopup()})},500);
}

// CHAIN FILTERS
function updateChainPills(){
  var chains=BERLINDEALS_DATA.chainsWithData||[],h='',allOn=activeChains.size===0||activeChains.size===chains.length;
  chains.forEach(function(c){var on=allOn||activeChains.has(c);h+='<div class="pill chain-pill'+(on?' on':'')+'" onclick="toggleChain(\''+c+'\')">'+c+'</div>'});
  document.getElementById('chainPills').innerHTML=h;
}
function toggleChain(c){
  if(activeChains.has(c)){activeChains.delete(c)}
  else{activeChains.add(c)}
  if(activeChains.size===0||activeChains.size===(BERLINDEALS_DATA.chainsWithData||[]).length)activeChains.clear();
  updateAll();
}

// FILTER PILLS
function cycleRadius(){
  var v=[null,1,3,5,10],l=['All Berlin','1 km','3 km','5 km','10 km'],i=v.indexOf(radiusKm);
  i=(i+1)%v.length;radiusKm=v[i];
  document.getElementById('radiusFilterPill').querySelector('span').textContent=l[i];
  document.getElementById('radiusFilterPill').classList.toggle('on',radiusKm!==null);
  updateAll();
}
function cycleDiscount(){
  var v=[0,10,20,30],l=[t('discount_any'),t('discount_10'),t('discount_20'),t('discount_30')],i=v.indexOf(discountMin);
  i=(i+1)%v.length;discountMin=v[i];updateDiscountPill();updateAll();
}
function updateDiscountPill(){
  var v=[0,10,20,30],l=[t('discount_any'),t('discount_10'),t('discount_20'),t('discount_30')],i=v.indexOf(discountMin);
  var p=document.getElementById('discountFilterPill');p.querySelector('span').textContent=l[i];p.classList.toggle('on',discountMin>0);
}

// SEARCH
var st;document.getElementById('searchInput').addEventListener('input',function(){
  document.getElementById('clearSearch').classList.toggle('visible',this.value.length>0);
  clearTimeout(st);st=setTimeout(function(){activeChain=null;updateAll()},200);
});
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('clearSearch').classList.remove('visible');activeChain=null;updateAll();map.setView([52.52,13.405],12)}

// LOCATION
function getUserLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(function(p){
    userLat=p.coords.latitude;userLng=p.coords.longitude;
    localStorage.setItem('bdm_userloc',JSON.stringify({lat:userLat,lng:userLng}));
    document.getElementById('locBtn').classList.add('active');document.getElementById('radiusFilterPill').style.display='flex';
    L.circleMarker([userLat,userLng],{radius:7,color:'#2563eb',fillColor:'#2563eb',fillOpacity:0.6,weight:2}).addTo(map).bindTooltip((lang==='de'?'Dein Standort':'You are here'),{permanent:false});
    updateAll();
  },function(e){console.log('Geo:',e.message)},{timeout:10000,enableHighAccuracy:false});
}
try{var sv=JSON.parse(localStorage.getItem('bdm_userloc'));if(sv&&sv.lat){userLat=sv.lat;userLng=sv.lng;document.getElementById('locBtn').classList.add('active');document.getElementById('radiusFilterPill').style.display='flex'}}catch(e){}

// UTILS
function haversine(la,lo,la2,lo2){var R=6371,dl=(la2-la)*Math.PI/180,dn=(lo2-lo)*Math.PI/180;var a=Math.sin(dl/2)**2+Math.cos(la*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dn/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function formatDist(k){if(k<0.1)return Math.round(k*1000)+' m';if(k<10)return k.toFixed(1)+' km';return Math.round(k)+' km'}
function formatWalkTime(k){var m=Math.round(k/5*60);if(m<1)return'<1 min';if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+'h'+(r?' '+r+'m':'')}
function formatPrice(c){return(c/100).toFixed(2).replace('.',',')}
function formatDate(ds){if(!ds)return'';var p=ds.split('-'),d=new Date(p[0],p[1]-1,p[2]),xd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],xm=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],xmd=['Jan','Feb','M\u00e4r','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];return lang==='de'?xd[d.getDay()]+' '+d.getDate()+'. '+xmd[d.getMonth()]:xd[d.getDay()]+' '+d.getDate()+' '+xm[d.getMonth()]}

// INIT
document.addEventListener('DOMContentLoaded',function(){initMap();initSearch();updateAll();document.getElementById('searchInput').placeholder=t('search_placeholder');document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.dataset.t)})});
</script>
